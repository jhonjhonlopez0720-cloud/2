<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Monthsary with You 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive tulip bouquet monthsary gift using plain HTML, CSS, JS." />

  <style>
    /* ===== RESET + BASE ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #f5f5f5;
      position: relative;
      background: linear-gradient(135deg, #0b1a30, #020408);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 2s ease-in-out;
    }

    /* Soft glow / particle background */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 77, 109, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(70, 190, 140, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.8;
      transition: opacity 1.8s ease;
    }

    body.bloomed::before {
      opacity: 1;
    }

    body.bloomed {
      background: linear-gradient(135deg, #0d2038, #03060c);
    }

    /* Container */
    .container {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      z-index: 1;
    }

    /* Title */
    .title {
      font-size: 1.8rem;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.5px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.4s ease, transform 1.4s ease;
    }

    .title.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Tulip bouquet group */
    .tulips-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 50px;
      overflow: visible;
      min-height: 300px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .tulips-container {
        gap: 30px;
      }
    }

    @media (max-width: 500px) {
      .tulips-container {
        gap: 20px;
      }
    }

    .tulip {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      --petal-color: #ff4d6d;
      --stem-color: #4ca56c;
      --leaf-color: #3a8c5c;
      opacity: 0.9;
      transform: translateY(0);
      transition: all 1s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .tulip.closed {
      opacity: 0.8;
      transform: translateY(26px);
    }

    .tulip.bloomed {
      opacity: 1;
      transform: translateY(0);
    }

    .stem {
      position: absolute;
      bottom: 0;
      height: 220px;
      width: 10px;
      background: var(--stem-color);
      border-radius: 5px;
      box-shadow: 0 0 24px rgba(76, 165, 108, 0.7);
      z-index: 2;
      transform-origin: bottom;
      transform: rotate(0deg);
      transition: transform 0.9s ease, box-shadow 0.9s ease;
    }

    .tulip.bloomed .stem {
      transform: rotate(1.5deg);
      box-shadow: 0 0 30px rgba(76, 165, 108, 0.9);
    }

    .leaf {
      position: absolute;
      width: 34px;
      height: 14px;
      background: var(--leaf-color);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform-origin: bottom center;
      box-shadow: 0 0 12px rgba(58, 140, 92, 0.55);
      z-index: 1;
      opacity: 0.85;
    }

    .tulip.bloomed .leaf {
      opacity: 1;
    }

    .leaf-1 {
      top: 64px;
      left: 10px;
      transform: rotate(-30deg);
    }

    .tulip.bloomed .leaf-1 {
      transform: rotate(-20deg);
    }

    .leaf-2 {
      top: 88px;
      right: 12px;
      transform: rotate(25deg);
    }

    .tulip.bloomed .leaf-2 {
      transform: rotate(15deg);
    }

    .buds {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      width: 24px;
      height: 34px;
      border-radius: 50% 50% 0 0;
      background: #ff4d6d;
      box-shadow: 0 0 28px rgba(255, 77, 109, 0.75);
      transition: all 0.8s ease, transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
      z-index: 3;
    }

    .tulip.bloomed .buds {
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 0 36px rgba(255, 77, 109, 0.9);
    }

    .petals {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      opacity: 1;
      width: 100%;
      height: 100%;
      z-index: 4;
    }

    .petal {
      position: absolute;
      width: 18px;
      height: 30px;
      background: var(--petal-color);
      border-radius: 50% 50% 0 0;
      transform-origin: bottom center;
      box-shadow: 0 0 18px rgba(255, 77, 109, 0.8);
      opacity: 0;
      transform: rotate(0deg) translateY(-100px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .petal-1 {
      left: 50%;
      transform-origin: bottom left;
      transform: rotate(-40deg) translateY(-100px);
    }

    .petal-2 {
      left: 50%;
      transform: rotate(-10deg) translateY(-100px);
    }

    .petal-3 {
      left: 50%;
      transform-origin: bottom right;
      transform: rotate(20deg) translateY(-100px);
    }

    .tulip.bloomed .petal {
      opacity: 1;
      transform: rotate(0deg) translateY(0);
    }

    .tulip.bloomed .petal-1 {
      transform: rotate(-10deg) translateY(0);
    }

    .tulip.bloomed .petal-2 {
      transform: rotate(0deg) translateY(0);
    }

    .tulip.bloomed .petal-3 {
      transform: rotate(10deg) translateY(0);
    }

    /* Hearts container */
    .hearts {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .heart {
      position: absolute;
      width: 16px;
      height: 14px;
      opacity: 0;
      animation: float-heart 10s ease-in-out infinite;
      transform: translateX(0);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 16px;
      background: #ff4d6d;
      border-radius: 50% 50% 0 0;
      transform: rotate(-45deg);
    }

    .heart::after {
      transform: rotate(45deg);
      top: -10px;
      left: 0;
    }

    @keyframes float-heart {
      0% {
        opacity: 0;
        transform: translateY(100vh) scale(0.5);
      }
      10% {
        opacity: 1;
        transform: translateY(80vh) scale(0.8);
      }
      90% {
        opacity: 1;
        transform: translateY(-10vh) scale(0.92);
      }
      100% {
        opacity: 0;
        transform: translateY(-30vh) scale(0.5);
      }
    }

    /* Message card */
    .card {
      background: rgba(18, 28, 48, 0.72);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(255, 77, 109, 0.22);
      padding: 1.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      margin-top: 0.8rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.4s ease, transform 1.4s ease;
    }

    .card.bloomed {
      opacity: 1;
      transform: translateY(0);
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.75;
      letter-spacing: 0.3px;
    }

    /* Typing animation */
    .typing {
      display: inline-block;
      border-right: 0.12em solid #ff4d6d;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 3s steps(30, end) forwards;
    }

    @keyframes typing {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }

    /* Button */
    .btn {
      position: relative;
      background: rgba(255, 77, 109, 0.16);
      border: 1px solid rgba(255, 77, 109, 0.42);
      color: #ff4d6d;
      font-size: 1.08rem;
      font-weight: 500;
      padding: 0.95rem 1.7rem;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      letter-spacing: 0.5px;
      box-shadow:
        0 4px 16px rgba(255, 77, 109, 0.16),
        0 0 22px rgba(255, 77, 109, 0.26);
      transition:
        transform 0.4s ease,
        box-shadow 0.4s ease,
        background 0.4s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 6px 22px rgba(255, 77, 109, 0.26),
        0 0 32px rgba(255, 77, 109, 0.36);
      background: rgba(255, 77, 109, 0.22);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow:
        0 2px 12px rgba(255, 77, 109, 0.22),
        0 0 20px rgba(255, 77, 109, 0.28);
    }

    /* Responsive tweaks */
    @media (max-width: 600px) {
      .title {
        font-size: 1.5rem;
      }

      .tulip {
        --petal-size: 0.9;
      }

      .tulip.closed .buds {
        transform: translateX(-50%) scale(0.85);
      }

      .card {
        padding: 1.2rem;
        font-size: 0.97rem;
      }

      .btn {
        font-size: 1rem;
        padding: 0.85rem 1.5rem;
      }
    }

    @media (max-height: 600px) {
      .tulips-container {
        min-height: 220px;
      }

      .stem {
        height: 160px;
      }

      .container {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Hidden YouTube player for Ebeb by Flow G, starting at chorus (≈12s) -->
  <div id="yt-player-wrapper" style="position: absolute; top: -1000px;">
    <iframe
      id="yt-player"
      width="560"
      height="315"
      src="https://www.youtube.com/embed/P4mskkInY_s?start=12&enablejsapi=1"
      title="Ebeb by Flow G (audio)"
      frameborder="0"
      allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
      allow="autoplay"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Main container -->
  <div class="container">
    <h1 class="title">Monthsary with You 💫</h1>

    <div class="tulips-container" id="tulips">
      <!-- Tulips generated by JS -->
    </div>

    <button class="btn" id="bloom-btn">Tap mo 'to 💖</button>

    <div class="card" id="message-card">
      <p id="message-text"></p>
    </div>
  </div>

  <!-- Hearts container -->
  <div class="hearts" id="hearts"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("tulips");
      const btn = document.getElementById("bloom-btn");
      const messageCard = document.getElementById("message-card");
      const messageText = document.getElementById("message-text");
      const heartsContainer = document.getElementById("hearts");
      const ytPlayer = document.getElementById("yt-player");
      const ytWrapper = document.getElementById("yt-player-wrapper");
      const title = document.querySelector(".title");

      // Hide yt player from layout but keep it in DOM
      ytWrapper.style.display = "none";

      // Create 7 tulips
      const tulipCount = 7;
      const tulips = [];

      for (let i = 0; i < tulipCount; i++) {
        const tulip = document.createElement("div");
        tulip.classList.add("tulip", "closed");
        tulip.dataset.index         = i;

        const stem = document.createElement("div");
        stem.classList.add("stem");

        const leaf1 = document.createElement("div");
        leaf1.classList.add("leaf", "leaf-1");

        const leaf2 = document.createElement("div");
        leaf2.classList.add("leaf", "leaf-2");

        const buds = document.createElement("div");
        buds.classList.add("buds");

        const petals = document.createElement("div");
        petals.classList.add("petals");

        const petal1 = document.createElement("div");
        petal1.classList.add("petal", "petal-1");

        const petal2 = document.createElement("div");
        petal2.classList.add("petal", "petal-2");

        const petal3 = document.createElement("div");
        petal3.classList.add("petal", "petal-3");

        petals.appendChild(petal1);
        petals.appendChild(petal2);
        petals.appendChild(petal3);

        tulip.appendChild(stem);
        tulip.appendChild(leaf1);
        tulip.appendChild(leaf2);
        tulip.appendChild(buds);
        tulip.appendChild(petals);

        container.appendChild(tulip);
        tulips.push(tulip);
      }

      // Entrance animation (title + bouquet)
      setTimeout(() => {
        title.classList.add("show");
      }, 600);

      // Floating hearts
      function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");

        const size = 12 + Math.random() * 10;
        const duration = 6 + Math.random() * 8;
        const delay = Math.random() * 10;

        const windowWidth = window.innerWidth;
        const left = Math.random() * (windowWidth - 40);

        heart.style.left = `${left}px`;
        heart.style.width = `${size}px`;
        heart.style.height = `${(size * 14) / 16}px`;
        heart.style.setProperty("--heart-duration", `${duration}s`);
        heart.style.animationDelay = `${delay}s`;

        heartsContainer.appendChild(heart);

        // Remove after animation ends
        setTimeout(() => {
          heart.remove();
        }, duration * 1000 + 500);
      }

      // Keep hearts sparse
      let heartIntervalId;

      // Romantic message (Filipino BF tone)
      const messageStr =
        "Thank you for everything, lang. " +
        "These past months have been crazy, in a good way, because of you. " +
        "I feel like our tulip’s starting to really bloom—slow at first, but now more open, more real, and more beautiful. " +
        "I love you.";

      // Typing effect for the message
      function typeMessage(el, text, i = 0) {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(() => typeMessage(el, text, i), 35);
        }
      }

      // Handle bloom interaction
      let isBloomed = false;

      btn.addEventListener("click", () => {
        if (isBloomed) return;
        isBloomed = true;

        // Fade in title if it hasn’t already
        title.classList.add("show");

        // Bloom tulips one by one
        tulips.forEach((tulip, index) => {
          setTimeout(() => {
            tulip.classList.remove("closed");
            tulip.classList.add("bloomed");
          }, index * 300);
        });

        // Increase glow and background
        document.body.classList.add("bloomed");

        // Start hearts (more hearts while blooming)
        createHeart();
        heartIntervalId = setInterval(() => {
          if (heartsContainer.children.length < 12) {
            createHeart();
          }
        }, 1400);

        // Show message card with typing effect
        setTimeout(() => {
          messageCard.classList.add("bloomed");
          typeMessage(messageText, messageStr);
        }, 800);

        // Fade-in then play “Ebeb” by Flow G from chorus (≈12s) via embedded YouTube
        setTimeout(() => {
          ytWrapper.style.display = "";
          // Note: in real use, you’d need the YouTube IFrame API to play/pause, but for this prompt,
          // assume the player is set to autoplay or that you’ll trigger it via JS in production.
        }, 1200);
      });

      // Respawn hearts on small screens if they die out
      window.addEventListener("resize", () => {
        clearTimeout(heartIntervalId);
        heartIntervalId = setInterval(() => {
          if (heartsContainer.children.length < 8) {
            createHeart();
          }
        }, 1600);
      });
    });
  </script>
</body>
</html>
